plugins {
    id 'com.android.application'
}

android {
    namespace 'com.omlet.arcade'
    compileSdk 35

    defaultConfig {
        applicationId 'com.omlet.arcade'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            // Deterministic debug keystore is generated by AGP on first build.
        }
        release {
            // R8 is intentionally off for this hardware; the shell is tiny and
            // the payload is the WebView.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // None. The shell is pure platform code on purpose.
}
