<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--
    CSP note: everything here is same-origin. No inline script, no inline style,
    no third-party fetch. The LiveKit library and its E2EE worker are vendored.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b1117" />
  <meta name="color-scheme" content="dark" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="referrer" content="no-referrer" />
  <meta name="description" content="Omlet Arcade: voice rooms, encrypted chat, Minecraft hosting and game streaming." />
  <title>Omlet Arcade</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='1.75'%3E%3Cpath d='M8.5 7 4 12l4.5 5'/%3E%3Cpath d='M15.5 7 20 12l-4.5 5'/%3E%3Cpath d='M10 19 14 5'/%3E%3C/svg%3E" />
  <!--
    window.OMLET_CONFIG.apiBase is optional. Left unset, the client talks to
    the origin it was served from, which is how the APK loads it.
  -->
  <script src="assets/vendor/livekit-client.umd.js"></script>
</head>
<body>
  <div class="app" id="app" aria-busy="true">
    <header class="app-bar" id="app-bar">
      <div class="app-bar__title"><span class="title">Omlet Arcade</span></div>
      <div class="app-bar__actions" id="app-bar-actions"></div>
    </header>
    <!-- The router builds the app bar, the scroll root and the nav bar here.
         Keeping the shell empty means there is exactly one place that owns
         the layout: js/router.js boot(). -->
  </div>
  <div id="overlays" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;color:#e6edf3">This app needs JavaScript. It runs entirely on your device; the server only stores your account and ciphertext.</p>
  </noscript>

  <script src="assets/icons/icons.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/e2ee.js"></script>
  <script src="js/roomkey.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/screens/auth.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/parties.js"></script>
  <script src="js/screens/friends.js"></script>
  <script src="js/screens/chat.js"></script>
  <script src="js/screens/minecraft.js"></script>
  <script src="js/screens/feed.js"></script>
  <script src="js/screens/profile.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
